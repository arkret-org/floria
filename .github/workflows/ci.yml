name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

defaults:
  run:
    working-directory: floria

jobs:
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: floria

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: floria -> target

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.5 --locked

      - name: Run cargo-deny
        run: cargo deny --locked check

  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: floria
          POSTGRES_PASSWORD: floria
          POSTGRES_DB: floria_registrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U floria -d floria_registrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLORIA_REGISTRATION_TEST_DATABASE_URL: postgres://floria:floria@localhost:5432/floria_registrations

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: floria

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Checkout Soland registration schema
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/soland
          path: soland
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Initialize registration test database
        run: >-
          psql "$FLORIA_REGISTRATION_TEST_DATABASE_URL" --set ON_ERROR_STOP=1
          --file ../soland/crates/storage-postgres/migrations/00000000000000_initial/up.sql

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: floria -> target

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo +stable test --workspace --all-targets --locked

  msrv:
    name: MSRV (Cargo.toml rust-version)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: floria

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install MSRV Rust toolchain
        # Must match `rust-version` in Cargo.toml so this job actually
        # verifies the declared floor.
        uses: dtolnay/rust-toolchain@1.98

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: floria -> target

      - name: Verify workspace builds on MSRV
        run: cargo check --workspace --all-targets --locked
