name: Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LOCAL_IMAGE: floria-ci:${{ github.sha }}

jobs:
  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out Arkret Rust SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build local image
        run: |
          docker buildx build \
            --build-context arkret-rust-sdk=arkret-rust-sdk \
            --file Dockerfile \
            --load \
            --tag "${LOCAL_IMAGE}" \
            .

      - name: Verify service startup and health probe
        run: |
          trap 'docker rm --force floria-ci-runtime >/dev/null 2>&1 || true' EXIT
          docker create --name floria-ci-runtime \
            --health-interval=1s --health-start-period=1s "${LOCAL_IMAGE}"
          docker cp tools/docker-smoke.kdl floria-ci-runtime:/app/floria.kdl
          docker start floria-ci-runtime
          healthy=false
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' floria-ci-runtime)" = healthy ]; then
              healthy=true
              break
            fi
            sleep 1
          done
          docker logs floria-ci-runtime
          test "$healthy" = true
          docker exec floria-ci-runtime /usr/local/bin/floria-healthcheck
          if docker run --rm --entrypoint /usr/local/bin/floria-healthcheck "${LOCAL_IMAGE}"; then
            echo "Health probe unexpectedly accepted a stopped listener"
            exit 1
          fi

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          vuln-type: os,library

      # Push steps are gated off — floria is a local-only project
      # (no crates.io / Docker Hub / GHCR publish). Build + scan
      # still run on every push and PR; the registry publish job is
      # intentionally kept around but disabled so the opt-in path
      # stays a one-line flip rather than a re-add.
      - name: Log in to GHCR
        if: false # local-only: no registry publish
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        if: false # local-only: no registry publish
        env:
          DOCKER_METADATA_OUTPUT_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "${DOCKER_METADATA_OUTPUT_TAGS}" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done
