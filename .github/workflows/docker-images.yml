name: Docker Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out Arkret Rust SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: 5a2d1665e1831ff6e6cefe8a0b09a4d37989b611
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-contexts: arkret-rust-sdk=arkret-rust-sdk
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
