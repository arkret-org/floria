name: Typos

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install typos
        run: cargo install typos-cli --version 1.44.0 --locked

      - name: Run typos
        run: typos --config typos.toml --force-exclude .
