# Example logrotate config for the floria audit log.
#
# Drop this into /etc/logrotate.d/floria (root:root, mode 0644).
# Adjust the path / owner / group to match your deployment.
#
# copytruncate is the safe default: floria keeps the audit FD open,
# and copytruncate guarantees that writes mid-rotation land in the
# fresh file rather than the rotated one. No SIGHUP is required.
#
# If audit volume is high, switch `daily` to `size 100M` (or any size
# threshold appropriate for your retention policy). For deployments
# running on systems without systemd, run logrotate from cron:
#   0 1 * * *  /usr/sbin/logrotate /etc/logrotate.d/floria

/var/log/floria/audit.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 floria floria
    copytruncate
    sharedscripts
    postrotate
        # No-op: floria keeps the FD open and copytruncate preserves
        # in-flight writes. Place restart/SIGHUP hooks here only if
        # you switch to a `create` strategy (which would require
        # floria to reopen the file).
    endscript
}
