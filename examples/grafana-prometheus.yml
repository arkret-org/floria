# Example Prometheus scrape config + relabel rules + Alertmanager
# hookup for a floria deployment. Pair this with the dashboard JSON
# in docs/en/grafana-dashboard.json and the alert rules in
# docs/en/prometheus-alerts.yml.
#
# Drop into prometheus.yml or compose alongside your existing config.
# Tested with Prometheus 2.53+; the relabel syntax also works on 3.x.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: floria-local
    region: local

# Pull in the rule file shipped with floria. Adjust path to wherever
# you mount docs/en/prometheus-alerts.yml.
rule_files:
  - /etc/prometheus/rules/floria-prometheus-alerts.yml

# ---------------------------------------------------------------
# Alertmanager hookup
# ---------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager.observability.svc.cluster.local:9093
      # Optional: route by severity label set in floria-prometheus-alerts.yml.
      # See Alertmanager's `route` config for the matching rules.

# ---------------------------------------------------------------
# Scrape config
# ---------------------------------------------------------------
scrape_configs:
  - job_name: floria
    metrics_path: /metrics
    scrape_interval: 10s
    # floria exposes /metrics on a dedicated port (default 8000) —
    # NOT on the public listener (port 5000). Scraping the public
    # listener would 404.
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [floria]
    relabel_configs:
      # Only scrape pods labelled app=floria.
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: floria
        action: keep
      # Pick the named "metrics" container port.
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      # Surface the pod name so the dashboard can break out replicas.
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      # Drop the noisy autogenerated kubernetes_* labels we do not use.
      - regex: __meta_kubernetes_pod_label_pod_template_(.+)
        action: labeldrop
    metric_relabel_configs:
      # CKP-0007 cardinality guard: drop any series carrying the
      # `_unknown` scope label so dashboards do not show a placeholder
      # bucket. (floria emits `_unknown` defensively when a request
      # arrives without realm/circle context.)
      - source_labels: [scope_id]
        regex: _unknown
        action: drop
      # Hide histogram buckets we never query — keeps Prometheus
      # storage lean.
      - source_labels: [__name__, le]
        regex: floria_pushkin_dispatch_seconds_bucket;(0\.005|0\.01)
        action: drop

  # Optional: scrape the local Redis primary so retry-queue alerts
  # have a cross-reference for connection counts.
  - job_name: floria-redis
    static_configs:
      - targets: [floria-redis-0.floria-redis:6379]
    metrics_path: /metrics
    # Requires the redis_exporter sidecar.
