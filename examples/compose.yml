# Soflare – Docker Compose example
#
# How to configure
# ================
#
# 1. Copy `soflare.sample.kdl` from the project root into this directory
#    (or wherever you prefer) and rename it to `floria.kdl`:
#
#      cp ../soflare.sample.kdl ./floria.kdl
#
#    YAML is also supported — use `soflare.sample.yaml` instead and set
#    SOFLARE_CONF to a `.yaml` path.
#
# 2. Edit `floria.kdl` to register your push provider apps.  Each child
#    node under `apps` represents one push provider.  Supported types:
#      - apns      (Apple Push Notification Service – token or cert auth)
#      - fcm       (Firebase Cloud Messaging – HTTP v1)
#      - jpush     (JPush)
#      - huawei    (Huawei Push Kit / HarmonyOS)
#      - xiaomi    (Xiaomi Mi Push)
#      - oppo      (OPPO / OPlus Push)
#      - oneplus   (OnePlus Push)
#      - vivo      (vivo Push)
#      - honor     (HONOR Push)
#      - webpush   (Web Push / VAPID)
#
# 3. If your push providers need credential files (APNS .p8 key, Firebase
#    service-account JSON, VAPID PEM, etc.), place them next to floria.kdl
#    and mount the directory as shown in the volume below.
#
# 4. For multi-instance deployments, set `http.notify_dedup.backend "redis"`
#    and `http.notify_dedup.redis_url "redis://redis:6379/0"` in floria.kdl,
#    then uncomment the Redis service below.
#
# 5. Adjust environment variables as needed:
#      - SOFLARE_CONF : path to the config file inside the container
#                     (default: /app/floria.kdl)
#                     The format is detected by file extension:
#                       .kdl  → KDL (default)
#                       .yaml / .yml → YAML
#      - RUST_LOG   : tracing filter, e.g. "floria=debug,info"
#
# 6. Start the service:
#
#      docker compose up -d
#
# 7. Verify it's running:
#
#      curl http://localhost:5000/ready
#
# Ports
# -----
#   5000 – HTTP API  (contrix push gateway endpoint)
#   8000 – Prometheus metrics (enable in config under metrics > prometheus)

services:
  floria:
    image: floria:latest
    # To build from source instead of using a pre-built image, uncomment:
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"   # HTTP API
      # - "8000:8000" # Prometheus metrics (uncomment if enabled in config)
    volumes:
      # Mount your config file and any credential files.
      # Adjust the host path (left side) to where your floria.kdl lives.
      - ./floria.kdl:/app/floria.kdl:ro
      # If credential files (APNS keys, Firebase JSON, VAPID PEM, etc.)
      # are in a separate directory, mount it too:
      # - ./credentials:/app/credentials:ro
    environment:
      SOFLARE_CONF: /app/floria.kdl
      # RUST_LOG: "floria=debug,info"
      # HTTPS_PROXY: "http://proxy.example.com:8080"  # outbound proxy for push requests
    # depends_on:
    #   - redis

