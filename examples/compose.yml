# Soflare – Docker Compose example
#
# How to configure
# ================
#
# 1. Copy `soflare.kdl.sample` from the project root into this directory
#    (or wherever you prefer) and rename it to `soflare.kdl`:
#
#      cp ../soflare.kdl.sample ./soflare.kdl
#
#    YAML is also supported — use `soflare.yaml.sample` instead and set
#    SOFLARE_CONF to a `.yaml` path.
#
# 2. Edit `soflare.kdl` to register your push provider apps.  Each child
#    node under `apps` represents one push provider.  Supported types:
#      - apns      (Apple Push Notification Service – token or cert auth)
#      - gcm       (Firebase Cloud Messaging – legacy key or HTTP v1)
#      - jpush     (JPush)
#      - huawei    (Huawei Push Kit / HarmonyOS)
#      - xiaomi    (Xiaomi Mi Push)
#      - oppo      (OPPO / OPlus Push)
#      - oneplus   (OnePlus Push)
#      - vivo      (vivo Push)
#      - honor     (HONOR Push)
#      - webpush   (Web Push / VAPID)
#
# 3. If your push providers need credential files (APNS .p8 key, Firebase
#    service-account JSON, VAPID PEM, etc.), place them next to soflare.kdl
#    and mount the directory as shown in the volume below.
#
# 4. Adjust environment variables as needed:
#      - SOFLARE_CONF : path to the config file inside the container
#                     (default: /app/soflare.kdl)
#                     The format is detected by file extension:
#                       .kdl  → KDL (default)
#                       .yaml / .yml → YAML
#      - RUST_LOG   : tracing filter, e.g. "soflare=debug,info"
#
# 5. Start the service:
#
#      docker compose up -d
#
# 6. Verify it's running:
#
#      curl http://localhost:5000/contrix/push/v1/notify
#
# Ports
# -----
#   5000 – HTTP API  (contrix push gateway endpoint)
#   8000 – Prometheus metrics (enable in config under metrics > prometheus)

services:
  soflare:
    image: soflare:latest
    # To build from source instead of using a pre-built image, uncomment:
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"   # HTTP API
      # - "8000:8000" # Prometheus metrics (uncomment if enabled in config)
    volumes:
      # Mount your config file and any credential files.
      # Adjust the host path (left side) to where your soflare.kdl lives.
      - ./soflare.kdl:/app/soflare.kdl:ro
      # If credential files (APNS keys, Firebase JSON, VAPID PEM, etc.)
      # are in a separate directory, mount it too:
      # - ./credentials:/app/credentials:ro
    environment:
      SOFLARE_CONF: /app/soflare.kdl
      # RUST_LOG: "soflare=debug,info"
      # HTTPS_PROXY: "http://proxy.example.com:8080"  # outbound proxy for push requests
