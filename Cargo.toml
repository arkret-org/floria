[package]
name = "floria"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "contrix-compatible push gateway service with APNS, FCM, WebPush, and domestic Android OEM providers."

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22.1"
blake2 = "0.10.6"
ed25519-dalek = "2.2.0"
futures = { version = "0.3.31", default-features = false, features = ["std"] }
globset = "0.4.18"
hex = "0.4.3"
isahc = { version = "1.7.2", default-features = false, features = ["http2"] }
kdl = "6.5.0"
jsonwebtoken = "10.3.0"
md-5 = "0.10.6"
redis = "0.32.7"
reqwest = { version = "0.13.2", default-features = false, features = ["form", "http2", "json", "native-tls"] }
salvo = { version = "0.89.3", features = ["affix-state", "logging"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.22"
prometheus = "0.14.0"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }
web-push = { version = "0.11.0", default-features = false, features = ["isahc-client"] }
x509-parser = "0.18.1"
