[package]
name = "floria"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "arkret-compatible push gateway service with APNS, FCM, WebPush, and domestic Android OEM providers."

[package.metadata.cargo-machete]
# The package name md-5 is imported through its md5 Rust crate name.
ignored = ["md-5"]

[workspace]
resolver = "3"
members = ["crates/floria-contracts"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
arkret-egress-reqwest = { path = "../arkret-rust-sdk/crates/egress-reqwest", default-features = false }
arkret-models-discovery = { path = "../arkret-rust-sdk/crates/models-discovery", default-features = false }
arkret-models-identity = { path = "../arkret-rust-sdk/crates/models-identity", default-features = false }
arkret-models-integration = { path = "../arkret-rust-sdk/crates/models-integration", default-features = false }
arkret-push-policy = { path = "../arkret-rust-sdk/crates/push-policy", default-features = false }
arkret-rate-limit = { path = "../arkret-rust-sdk/crates/rate-limit", default-features = false }
arkret-retry = { path = "../arkret-rust-sdk/crates/retry", default-features = false }
arkret-signatures = { path = "../arkret-rust-sdk/crates/signatures", default-features = false }
arkret-wire = { path = "../arkret-rust-sdk/crates/wire", default-features = false }
floria-contracts = { version = "0.3.0", path = "crates/floria-contracts" }

aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
blake2 = "0.11.0"
chacha20poly1305 = "0.11"
ed25519-dalek = "3.0.0"
globset = "0.4.20"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = { version = "0.13.0", default-features = false }
jsonwebtoken = "11.0.0"
kdl = "6.7.1"
lru = "0.18.3"
md-5 = "0.11.0"
opentelemetry = { version = "0.32.0", default-features = false }
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry_sdk = { version = "0.32.1", default-features = false }
p256 = "0.14.0"
postgres = "0.19.14"
prometheus = "0.14.0"
proptest = { version = "1", default-features = false }
r2d2 = "0.8.10"
rand = "0.10"
getrandom = "0.4.3"
redis = { version = "1.6.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
salvo = { version = "=0.96.0", default-features = false }
sentry = { version = "0.49.2", default-features = false }
sentry-tracing = "0.49.2"
serde = "1.0.229"
serde-saphyr = "1.2.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = "1.53.1"
tokio-postgres-rustls = { version = "0.14.0", features = ["native-certs", "ring"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = "0.3.23"
uuid = "1.26.0"
x509-parser = "0.18.1"

[dependencies]
# Push and service wire models come from the edge leaf; HTTP signatures use
# the transport-only signatures feature so the gateway does not compile core.
arkret-egress-reqwest.workspace = true
arkret-models-discovery = { workspace = true, default-features = false }
arkret-models-identity = { workspace = true, default-features = false }
arkret-models-integration = { workspace = true, default-features = false }
arkret-push-policy = { workspace = true, default-features = false }
arkret-rate-limit.workspace = true
arkret-retry.workspace = true
arkret-signatures = { workspace = true, default-features = false }
arkret-wire = { workspace = true, default-features = false }
floria-contracts.workspace = true

aes-gcm.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake2.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
globset.workspace = true
hex.workspace = true
hkdf.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
kdl.workspace = true
lru.workspace = true
md-5.workspace = true
opentelemetry = { workspace = true, default-features = false, features = ["trace"] }
opentelemetry-otlp = { workspace = true, default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { workspace = true, default-features = false, features = ["trace", "rt-tokio"] }
p256 = { workspace = true, features = ["ecdh"] }
postgres.workspace = true
prometheus.workspace = true
r2d2.workspace = true
rand.workspace = true
getrandom.workspace = true
redis = { workspace = true, default-features = false }
reqwest = { workspace = true, default-features = false, features = ["form", "http2", "json", "rustls-no-provider"] }
rustls.workspace = true
salvo = { workspace = true, features = ["affix-state", "fix-http1-request-uri", "http1", "http2", "logging", "rfc9457", "server", "server-handle"] }
sentry = { workspace = true, default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls-no-provider"] }
sentry-tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres-rustls.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, default-features = false, features = ["tracing-log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "registry"] }
uuid = { workspace = true, features = ["serde", "v4"] }
x509-parser.workspace = true

[dev-dependencies]
# T8.2 — property tests for the provider-payload sanitizer.
proptest = { workspace = true, default-features = false, features = ["std"] }
salvo = { workspace = true, features = ["test"] }

[lints]
workspace = true
